appId: fr.yasder5.orbelauncher
productName: Orbe Launcher
copyright: Copyright © 2026 Yasser Boulayoune
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# les thèmes livrés restent des fichiers lisibles (copiés à côté de l'appli, modifiables)
extraResources:
  - from: themes
    to: themes
asarUnpack:
  - node_modules/koffi/**
win:
  icon: build/icon.ico
  target: [nsis, portable]
  # Signature : faite seulement si un certificat est fourni (variables WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD, voir README)
  signtoolOptions:
    publisherName: Yasser Boulayoune
    signingHashAlgorithms: [sha256]
    rfc3161TimeStampServer: http://timestamp.digicert.com
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Orbe Launcher
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  # fenêtre d'installation aux couleurs d'Orbe
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  license: LICENSE
  installerLanguages: [fr_FR, en_US]
  language: '1036'
  multiLanguageInstaller: true
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  artifactName: ${productName}-Portable-${version}.${ext}
